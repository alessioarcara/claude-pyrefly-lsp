name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Marketplace manifest
        run: claude plugin validate .
      - name: Plugin manifest
        run: claude plugin validate plugins/pyrefly-lsp
      - name: The hook warns, in JSON, when pyrefly is missing
        run: sh plugins/pyrefly-lsp/hooks/check-pyrefly.sh | python3 -c 'import json, sys; assert "pyrefly" in json.load(sys.stdin)["systemMessage"]'
